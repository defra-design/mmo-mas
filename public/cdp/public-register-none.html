<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public register</title>
    <link rel="stylesheet" href="cdp.css" />
  </head>
  <body>
    <!-- The applicant asked for nothing to be withheld, so the follow-up question
         asking what and why is never put to them and there is nothing to show. -->
    <main class="section section--wide-labels">
      <h1 class="section__title">Sharing your project information publicly</h1>

      <dl class="fields">
        <div class="field">
          <dt class="field__label">
            Do you want to request that information is withheld for either of these reasons?
            <ul class="field__hint-list">
              <li>compromise national security</li>
              <li>breach a legally protected commercial or industrial confidentiality</li>
            </ul>
          </dt>
          <dd class="field__value">No</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
