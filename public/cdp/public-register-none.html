<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Withholding information</title>
    <link rel="stylesheet" href="cdp.css" />
  </head>
  <body>
    <!-- The applicant asked for nothing to be withheld, so they were never asked
         for a reason and there is nothing more to show. -->
    <main class="section section--wide-labels">
      <h1 class="section__title">Withholding information from the public register</h1>

      <dl class="fields">
        <div class="field">
          <dt class="field__label">Do you want to ask us to withhold any information from the public register?</dt>
          <dd class="field__value">No</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
